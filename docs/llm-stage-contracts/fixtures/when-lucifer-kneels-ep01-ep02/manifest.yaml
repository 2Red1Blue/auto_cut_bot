    digest_summary: 开篇展现七年前天堂圣堂内的悲剧：炽天使Lucifer发现妻子Selene被锁链缚在十字架上焚为焦黑躯体，崩溃痛哭自责，金发天使Sariel现身嘲讽称处死Selene是帮他避免更大惩罚，Lucifer怒而召唤法杖宣战，称若天堂没有妻子的位置便将天堂焚毁，两人激战中Lucifer被Sariel的光剑重创，他宣告与虚伪天堂彻底决裂，抱着Selene的遗体离开，Sariel在他身后大笑。时间跳转至七年后，堕天的Lucifer化身为头生犄角、背生恶魔翼的红眼恶魔形态降临人间城镇，被人类称作撒旦，引发镇民恐慌奔逃。他来到墓园在Selene的墓碑前悼念，立誓要让天堂血债血偿，随后发现并击伤长期跟踪自己的银发铠甲天使，顺着天使逃跑的方向追踪到林间破旧木屋。屋内Selene并未死亡，脸上布满金色诅咒裂纹濒临死亡，她和Lucifer的女儿Aurora回家发现母亲垂危崩溃痛哭，Selene告知女儿诅咒即将发作自己时日无多。Lucifer在屋外听到哭声，施放时间停止魔法冻结了周围的时间，走到破窗边时震惊地看到了本应在七年前死去的Selene。
    opening_state: 烈焰与圣光交织中，Selene被锁链缚在十字架上遭受火刑，处刑现场惨烈肃穆。
    ending_state: Lucifer在木屋外施放时间停止魔法，空中雨滴悬停，他站在破碎的窗边，震惊地注视着屋内躺在床上、被金色诅咒侵蚀的Selene，床边的Aurora维持着痛哭的静止姿态。
