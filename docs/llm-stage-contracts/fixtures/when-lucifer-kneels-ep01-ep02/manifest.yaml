      raw_description: ▲大雨滂沱，雷声轰鸣。那名受伤的天界守卫躲在木屋后面，Lucifer如鬼魅般紧随其后降落在木屋附近的泥泞道路，发现天使守卫的踪迹在这一刻竟然凭空消失了。▲Lucifer有些烦躁地捏紧拳头，准备离开。就在这时，由于距离极近，木屋内Aurora绝望的哭喊声瞬间穿透了风雨，清晰地传进了他的耳朵。▲Lucifer缓缓转过头，盯着那扇透出微弱火光的破烂木门。▲屋内，瘫倒在草垫上、面容虚弱的Selene，也正好在这一瞬间抬起头。Lucifer看见木屋内的场景时瞳孔瞪大。（虚假卡点，Lucifer仿佛看见Selene）
