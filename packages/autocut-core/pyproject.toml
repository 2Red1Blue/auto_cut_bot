[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocut-core"
version = "0.0.1"
description = "AutoCut 共享运行时核心 — schema, db, contracts, libs, stages"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
pipeline = [
    "litellm>=1.80",
    "python-dotenv>=1.0.0",
    "volcengine-python-sdk[ark]>=5.0.45",
]

[tool.hatch.build.targets.wheel]
packages = ["autocut_core"]
