[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocut-kernel"
version = "0.1.0"
description = "Shared kernel boundary for AutoCut runtimes"
requires-python = ">=3.11"
dependencies = ["psycopg>=3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/autocut_kernel"]

[tool.hatch.build.targets.sdist]
include = ["src/autocut_kernel/**", "pyproject.toml"]
