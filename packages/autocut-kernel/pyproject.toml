[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocut-kernel"
version = "0.1.0"
description = "Dependency-free shared kernel boundary for AutoCut runtimes"
requires-python = ">=3.11"
dependencies = ["psycopg>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]
