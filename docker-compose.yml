x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      AUTO_CUT_BOT_CHANNELS: ${AUTO_CUT_BOT_CHANNELS:-whatsapp}
  volumes:
    - ~/.auto_cut_bot:/home/auto_cut_bot/.auto_cut_bot
  cap_drop:
    - ALL

services:
  auto_cut_bot-gateway:
    container_name: auto_cut_bot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  auto_cut_bot-api:
    container_name: auto_cut_bot-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/auto_cut_bot/.auto_cut_bot/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  auto_cut_bot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
