[project]
name = "auto-cut-bot-ai"
version = "0.3.0"
description = "A lightweight personal AI assistant framework"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Xubin Ren"},
    {name = "the auto_cut_bot contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "anthropic>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Feishu's lark-oapi currently requires websockets<16; core supports 15 and 16.
    "websockets>=15.0,<17.0",
    "websocket-client>=1.9.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ddgs>=9.5.5",
    "oauth-cli-kit>=0.1.6,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.1",
    "lxml-html-clean>=0.3.0",
    "rich>=13.0.0",
    "croniter>=2.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "questionary>=2.0.0,<3.0.0",
    "mcp>=1.0.0",
    "json-repair>=0.30.0",
    "chardet>=3.0.2",
    "openai>=2.8.0",
    "tiktoken>=0.7.0",
    "jinja2>=3.1.0,<4.0.0",
    "dulwich>=0.22.0,<1.0.0",
    "pyyaml>=6.0,<7.0.0",
    "filelock>=3.25.2",
    "watchfiles>=0.21.0",
    "packaging>=24.0",
    "tzdata>=2024.1",
    "tzlocal>=5.0",
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
api = [
    "aiohttp>=3.9.0",
]
azure = [
    "azure-identity>=1.19.0,<2.0.0",
]
bedrock = [
    "boto3>=1.43.0",
]
documents = [
    # Compatibility extra: document readers are bundled since v0.2.3.
    "defusedxml>=0.7.1,<1.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
]
langfuse = [
    "langfuse>=3.0.0,<4.0.0",
]
pdf = [
    # Compatibility extra: PDF reading is bundled since v0.2.3.
    "pypdf>=4.0.0",
]
olostep = [
    "olostep>=0.1.0; python_version < '3.14'",
]
pipeline = [
    "autocut",
    "litellm>=1.80",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "aiohttp>=3.9.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "ruff>=0.1.0",
    "basedpyright>=1.39.0,<2.0.0",
    "pymupdf>=1.25.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",
    "python-socketio>=5.16.0,<6.0.0",
    "msgpack>=1.1.0,<2.0.0",
]

[project.scripts]
auto_cut_bot = "auto_cut_bot.cli.commands:app"

# Third-party tool plugins register here.  Built-in tools are discovered
# automatically via pkgutil scanning in ToolLoader.discover().
# [project.entry-points."auto_cut_bot.tools"]
# my_plugin = "my_package.plugins:MyTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.custom]
# Implementation lives in the conventional `hatch_build.py` at the repo root.

[tool.hatch.build]
include = [
    "auto_cut_bot/**/*.py",
    "auto_cut_bot/templates/**/*.md",
    "auto_cut_bot/skills/**/*.md",
    "auto_cut_bot/skills/**/*.sh",
    "auto_cut_bot/channels/*/webui/**/*",
    "auto_cut_bot/web/dist/**/*",
]
# auto_cut_bot/web/dist/ is produced by `cd webui && bun run build` and is
# git-ignored. List it as an artifact so hatch ships it in both wheel and
# sdist even though VCS does not track it.
artifacts = [
    "auto_cut_bot/web/dist/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["auto_cut_bot"]
exclude = ["auto_cut_bot/channels/*/tests/**"]

[tool.hatch.build.targets.wheel.sources]
"auto_cut_bot" = "auto_cut_bot"

[tool.hatch.build.targets.sdist]
include = [
    "auto_cut_bot/",
    "auto_cut_bot/web/dist/",
    "hatch_build.py",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
]
exclude = ["auto_cut_bot/channels/*/tests/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.basedpyright]
include = ["auto_cut_bot"]
exclude = ["**/tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "auto_cut_bot/channels"]

[tool.coverage.run]
source = ["auto_cut_bot"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
